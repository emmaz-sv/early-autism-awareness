name: Build and deploy Jekyll site

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install bundler and Jekyll
        run: |
          gem install bundler jekyll
      - name: Inject last updated time
        run: |
          echo "" >> docs/_config.yml
          echo "last_updated: \"$(git log -1 --format=%cd --date=format:'%B %d, %Y')\"" >> docs/_config.yml
      - name: Build site
        run: |
          jekyll build --source docs --destination _site
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
